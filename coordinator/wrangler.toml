name = "nycc-grid-coordinator"
main = "src/worker.js"
compatibility_date = "2026-08-19"
workers_dev = true

routes = [
  { pattern = "grid.newyorkcomputeclub.com", custom_domain = true },
]

# the club ed25519 verify key, base64. empty means POST /v1/jobs stays open to anyone
# who can reach the worker, exactly as v1 deployed. set it and job submission is
# members only: every submit then needs a card signed by this key plus a member
# signature. it is a public key, so it belongs in the file rather than in a secret.
# set it in the same deploy as the members' cards or the grid stops accepting work.
#
# the operational rule: gating happens by committing the real key into this file and
# deploying that commit. never gate by editing the dashboard, and never by editing this
# line locally without committing it. [vars] is redeployed in full on every `wrangler
# deploy`, so the next deploy from a clean checkout would overwrite the gate with the
# empty default below and reopen submission to anyone, silently and with no error.
[vars]
CLUB_VERIFY_KEY = ""

# zero npm deps. src/logic.js is plain esm and is the only thing under test.
#
# id is the real production namespace, live behind grid.newyorkcomputeclub.com. there is
# deliberately no preview_id: it used to be a copy of the id above, which pointed
# `wrangler dev --remote` at production keys, so a dev run could overwrite a member's job
# record. create a second namespace before the next remote dev run and put it here:
#   wrangler kv namespace create GRID --preview
# until then `wrangler dev --remote` fails loudly, which is the outcome we want, and
# plain `wrangler dev` keeps using its local simulated kv.
[[kv_namespaces]]
binding = "GRID"
id = "f62544982bf242ff8e4580414b9b9669"

[observability]
enabled = true
